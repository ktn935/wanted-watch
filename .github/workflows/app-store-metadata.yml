name: App Store metadata / submission

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Which fastlane lane to run'
        required: true
        default: 'upload_metadata'
        type: choice
        options:
          - upload_metadata
          - submit_review

jobs:
  fastlane:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Restore App Store Connect API key
        run: |
          mkdir -p keys
          echo "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 --decode > keys/AuthKey.p8

      - name: Run fastlane
        env:
          ASC_API_KEY_PATH: keys/AuthKey.p8
          ASC_KEY_ID: 855WCW8NQC
          ASC_ISSUER_ID: 8b8501f7-0c5f-490a-a126-5062739a7461
        run: bundle exec fastlane ${{ github.event.inputs.lane }}
